name: One-time domain rewrite
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace the old domain in the two HTML pages
        run: |
          set -euo pipefail
          files=$(grep -l 'travel4iran\.github\.io' index.html en/index.html || true)
          if [ -z "$files" ]; then
            echo "Nothing to rewrite."
            exit 0
          fi
          echo "Rewriting: $files"
          sed -i 's/travel4iran\.github\.io/travel-amin.github.io/g' $files
          grep -n 'travel4iran' $files && exit 1 || true
          git config user.name "Travel Amin"
          git config user.email "352894151+Travel-Amin@users.noreply.github.com"
          git add $files
          git commit -m "Replace the old site domain in the Arabic and English pages"
          git push origin HEAD:main
