name: One-time verification tag
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Insert the Search Console meta tag and remove this workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          line = '<meta name="google-site-verification" content="googleb2ebb26e5218cbc9" />\n'
          for p in ("index.html", "en/index.html"):
              s = open(p, encoding="utf-8").read()
              if "googleb2ebb26e5218cbc9" in s:
                  print(p, "already present")
                  continue
              marker = '<meta http-equiv="Content-Security-Policy"'
              i = s.index(marker)
              open(p, "w", encoding="utf-8").write(s[:i] + line + s[i:])
              print(p, "updated")
          PY
          git rm -q .github/workflows/tag-verify.yml
          git config user.name "Travel Amin"
          git config user.email "352894151+Travel-Amin@users.noreply.github.com"
          git add index.html en/index.html
          git commit -m "Add the Search Console verification meta tag to both pages"
          git push origin HEAD:main
